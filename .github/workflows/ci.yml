name: DevSecOps Pipeline

# 1. ¿Cuándo se ejecuta esto? (Triggers)
on:
  push:
    branches: [ "main" ]

# 2. ¿Qué va a hacer el robot? (Jobs)
jobs:
  build-and-scan:
    name: Construir y Escanear Imagen
    runs-on: ubuntu-latest # Una máquina virtual limpia de GitHub

    steps:
      # Paso A: Descargar tu código a la máquina virtual
      - name: Descargar el código
        uses: actions/checkout@v4

      # Paso B: Construir la imagen Docker usando tu Dockerfile
      - name: Construir imagen Docker
        run: docker build -t mi-app-segura:latest .

      # Paso C: Escanear con Trivy
      - name: Escaneo de Seguridad (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-app-segura:latest'
          format: 'table'
          # CRÍTICO: El pipeline fallará si encuentra vulnerabilidades ALTAS o CRÍTICAS
          exit-code: '1' 
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
